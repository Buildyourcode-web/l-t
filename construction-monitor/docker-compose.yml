version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: cm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: construction_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d construction_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cm_network

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cm_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: construction_monitor
      DB_USER: postgres
      DB_PASSWORD: postgres
      MODEL_PPE_PATH: /app/models/ppe.pt
      MODEL_FIRE_PATH: /app/models/fire.pt
      MODEL_DEVICE: "0"  # Use GPU 0. Set to "cpu" if no GPU in container
      DETECTION_FPS: "2"
      ALERT_COOLDOWN_SECONDS: "30"
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models:ro          # Mount trained model files (read-only)
      - ./config:/app/config:ro          # Mount camera config (read-only)
      - screenshots_vol:/app/screenshots # Persistent screenshots
      - reports_vol:/app/reports         # Persistent reports
      - logs_vol:/app/logs               # Persistent logs
    ports:
      - "8000:8000"
    networks:
      - cm_network
    # GPU support (uncomment if using NVIDIA GPU in Docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - cm_network

networks:
  cm_network:
    driver: bridge

volumes:
  postgres_data:
  screenshots_vol:
  reports_vol:
  logs_vol:
